services:
  redis:
    image: redis:7-alpine
    container_name: cache-stampede-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: cache-stampede-app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"

  # Optional: browse Redis keys/TTLs while the demo runs.
  # Visit http://localhost:8081 after `docker compose up`.
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: cache-stampede-redis-ui
    depends_on:
      - redis
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
